<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specificity & Cascade</title>
    <style>
       /* The specificity of this selector is 1 */
     h1{
        color:aqua;
     }
            /* The specificity of this selector is 10 */
     .cpurple{
        color: purple;
     }
            /* The specificity of this selector is 10 */
     .cred{
        color:red;
     }
            /* The specificity of this selector is 1 + 10 = 11 */
    h1.yellow{
        color: blue;
     }
            /* The specificity of this selector is 10 */
     /* This is the example of attribute selector */
      [data-x=a]{
        background-color: maroon;
     } 
      
            /* The specificity of this selector is 1 + 10 + 10 +10 +10 = 41 */
     a.harryclass.rohan-class[href]:hover{
      color: brown;
     }
    </style>
</head>
<body>
    
    <div>
        <h1 class="yellow cred cpurple" data-x="a">Hello world</h1>
    </div>
    
</body>
</html>
